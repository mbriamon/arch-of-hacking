- id: JvkCvxZfAsshMjrdjLnFtQ
  name: MOLOCH Collective 
  type: Defense 
  category: ATK N/A, DEF N/A
  description: 'EVENT / TRAP: When an opponent warrior declares an attack, negate the attack and inflict LP damage to your opponent equal to the attacking warrior IMP. Collectives often employ decentralized retaliation to neutralize institutional overreach by exposing an attacker’s own vulnerabilities.'
