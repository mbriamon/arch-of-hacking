  value: 3

- id: QprJgLgz5njeXQZWZ4GqRb
  name: The Grey-Hat Transition
  type: Defense
  category: ATK N/A, DEF N/A
  description: 'EVENT / TRAP: Target 1 opposing warrior it loses 2 IMP and it cannot change its battle position. This represents how many rogue actors eventually transitioned into legal security roles, blurring the lines between subversion and corporate defense.'
  image: https://raw.githubusercontent.com/mbriamon/arch-of-hacking/main/infosec-deck/doc/images/GreayhatTransaction.png
