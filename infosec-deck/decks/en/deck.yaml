- id: ReC2YysUS9AduxeChRcM23
  name: Smashing the Stack for Fun and Profit 
  type: Skill
  category: ATK N/A, DEF N/A 
  description: 'TECHNIQUE / SPELL: Destroy the opposing warrior with the lowest COV on the field. Named after a seminal 1996 article, this technique popularized buffer overflow exploits and transformed software vulnerabilities into weaponized attacks.'
  image: https://raw.githubusercontent.com/mbriamon/arch-of-hacking/main/infosec-deck/doc/images/SmashingtheStack.png
  image credits: Gemini/David
  value: 2

- id: Dw3hb5Q3M4D3QFTZC9FDRr
  name: ISP Breach
  type: Skill
  category: ATK N/A, DEF N/A
  description: 'TECHNIQUE / SPELL: Target 1 warrior in either player discard pile and special summon it to your side. Early internet service providers were frequent targets for hackers seeking infrastructure control and backdoor access to broader networks.'
  image: https://raw.githubusercontent.com/mbriamon/arch-of-hacking/main/infosec-deck/doc/images/ISP%20Breach.png
  image credits: Gemini/David
  value: 3

- id: H5espgm8FwUDh7DfTDXEBb
  name: Digital Sit-In
  type: Skill
  category: ATK N/A, DEF N/A
  description: 'TECHNIQUE / SPELL: Opposing warriors cannot declare an attack for 3 of your opponent''s turns. Modeled after civil rights protests, early hacktivists used automated page reloads to overwhelm targets, establishing the foundational tactic of DDoS.'
  image: https://raw.githubusercontent.com/mbriamon/arch-of-hacking/main/infosec-deck/doc/images/DigitalSitIn.png
  image credits: Gemini/David
  value: 3

- id: beRVg6bcEJ3bVEYnALXAkT
  name: Phrack Publication 48
  type: Defense
  category: ATK N/A, DEF N/A
  description: 'EVENT / TRAP: When your warrior is destroyed search your deck for 1 warrior with 3 or less IMP and add it to your hand. Phrack was a vital underground magazine that circulated exploits and became a focal point for early cyber-law debates.'
